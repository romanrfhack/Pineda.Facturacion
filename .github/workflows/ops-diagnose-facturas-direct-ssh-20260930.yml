name: OPS Diagnose Facturas Direct SSH 2026-09-30

on:
  push:
    branches:
      - ops/diagnose-vps-outage-20260930
    paths:
      - .github/workflows/ops-diagnose-facturas-direct-ssh-20260930.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: facturas-production
    timeout-minutes: 5
    env:
      SSH_USER: ${{ secrets.FACTURAS_SSH_USER }}
      SSH_KEY: ${{ secrets.FACTURAS_SSH_KEY }}

    steps:
      - name: Setup SSH
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SSH_USER:-}" ]
          [ -n "${SSH_KEY:-}" ]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Read-only diagnostics via public host
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=no             -o ConnectTimeout=12 -p 22 "$SSH_USER@facturas.autorefaccionespineda.site" 'bash -s' <<'REMOTE'
          set +e
          hostname
          date -Is
          uptime
          free -h
          df -h /
          df -i /
          printf 'system_state='
          systemctl is-system-running || true

          for unit in nginx facturas-api facturas-dev-api; do
            printf '\nunit=%s active=' "$unit"
            systemctl is-active "$unit" || true
            systemctl show "$unit" -p ActiveEnterTimestamp -p ExecMainStatus -p NRestarts --no-pager || true
            sudo systemctl status "$unit" --no-pager -l | tail -30 || true
          done

          printf '\nnginx_test\n'
          sudo nginx -t 2>&1 || true

          printf '\nlisteners\n'
          sudo ss -lntp | awk 'NR == 1 || /:80 |:443 |:5000 |:5007 /' || true

          printf '\nlocal_health\n'
          for url in http://127.0.0.1:5000/health/live http://127.0.0.1:5000/health/ready http://127.0.0.1:5007/health/live http://127.0.0.1:5007/health/ready; do
            body=$(mktemp)
            code=$(curl -sS --connect-timeout 3 --max-time 8 -o "$body" -w '%{http_code}' "$url")
            printf '%s code=%s rc=%s body=' "$url" "$code" "$?"
            head -c 700 "$body" 2>/dev/null | tr '\n' ' '
            printf '\n'
          done

          printf '\ndev_recent_logs\n'
          sudo journalctl -u facturas-dev-api -p warning -n 100 --no-pager --output=short-iso 2>&1 || true
          REMOTE
