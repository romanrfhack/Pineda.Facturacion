name: Agent Debt Summary Eligibility Validation

on:
  push:
    branches:
      - agent/fix-debt-summary-eligibility-500

concurrency:
  group: agent-debt-summary-eligibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: Strong_Passw0rd_2026!
          MYSQL_DATABASE: facturas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__DefaultConnection: Server=localhost;Database=facturas_test;User=root;Password=Strong_Passw0rd_2026!;
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate backend
        id: validate
        shell: bash
        run: |
          set +e
          : > validation.log
          : > status.env
          overall=0

          run_logged() {
            label="$1"
            shift
            printf '\n===== %s =====\n' "$label" | tee -a validation.log
            "$@" 2>&1 | tee -a validation.log
            code=${PIPESTATUS[0]}
            printf '%s=%s\n' "$label" "$code" >> status.env
            if [ "$code" -ne 0 ]; then
              overall=1
            fi
          }

          run_logged dotnet_restore dotnet restore Pineda.Facturacion.slnx
          run_logged dotnet_build dotnet build -c Release Pineda.Facturacion.slnx --no-restore
          run_logged dotnet_test dotnet test -c Release Pineda.Facturacion.slnx --no-build
          run_logged mysql_tests bash -lc 'export PINEDA_FACTURACION_RUN_MYSQL_TESTS=true; export PINEDA_FACTURACION_MYSQL_TEST_CONNECTION="Server=127.0.0.1;Port=3306;User ID=root;Password=Strong_Passw0rd_2026!;AllowPublicKeyRetrieval=True;SslMode=None;"; dotnet test -c Release tests/Pineda.Facturacion.IntegrationTests/Pineda.Facturacion.IntegrationTests.csproj --filter "Category=MySqlIntegration" --no-build'

          echo "overall_status=$overall" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist validation result
        if: always()
        shell: bash
        env:
          OVERALL_STATUS: ${{ steps.validate.outputs.overall_status }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .agent-ci
          tail -n 500 validation.log > .agent-ci/debt-summary-eligibility-log-tail.txt

          if [ "$OVERALL_STATUS" = "0" ]; then
            result="success"
          else
            result="failure"
          fi

          cat > .agent-ci/debt-summary-eligibility-result.md <<EOF
          # Debt summary eligibility validation

          - Commit validated: $VALIDATED_SHA
          - Result: $result

          ## Exit codes
          EOF
          cat status.env >> .agent-ci/debt-summary-eligibility-result.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent-ci/debt-summary-eligibility-result.md .agent-ci/debt-summary-eligibility-log-tail.txt
          git commit -m "ci: record debt summary eligibility validation [skip ci]"
          git push

      - name: Fail when validation failed
        if: steps.validate.outputs.overall_status != '0'
        run: exit 1
