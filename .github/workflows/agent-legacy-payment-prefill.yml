name: Agent Legacy Payment Prefill

on:
  push:
    branches:
      - agent/legacy-payment-prefill
    paths:
      - .github/workflows/agent-legacy-payment-prefill.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: Strong_Passw0rd_2026!
          MYSQL_DATABASE: facturas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__DefaultConnection: Server=localhost;Database=facturas_test;User=root;Password=Strong_Passw0rd_2026!;
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legacy-payment-prefill
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Apply implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/agent/fix-legacy-payment-script.py
          python3 .github/agent/legacy-payment-prefill.py

      - name: Backend restore and build diagnostics
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet restore Pineda.Facturacion.slnx
          dotnet build -c Release Pineda.Facturacion.slnx

      - name: Generate EF migration
        shell: bash
        run: |
          set -euo pipefail
          dotnet ef migrations add AddLegacyPaymentSuggestionSnapshot \
            --project src/Pineda.Facturacion.Infrastructure.BillingWrite/Pineda.Facturacion.Infrastructure.BillingWrite.csproj \
            --startup-project src/Pineda.Facturacion.Api/Pineda.Facturacion.Api.csproj \
            --context BillingDbContext \
            --output-dir Persistence/Migrations \
            --configuration Release \
            --no-build

      - name: Backend tests
        shell: bash
        env:
          DOTNET_ENVIRONMENT: Development
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          set -euo pipefail
          dotnet test -c Release Pineda.Facturacion.slnx --no-build

      - name: MySQL-backed integration subset
        shell: bash
        env:
          DOTNET_ENVIRONMENT: Development
          ASPNETCORE_ENVIRONMENT: Development
          PINEDA_FACTURACION_RUN_MYSQL_TESTS: "true"
          PINEDA_FACTURACION_MYSQL_TEST_CONNECTION: Server=127.0.0.1;Port=3306;User ID=root;Password=Strong_Passw0rd_2026!;AllowPublicKeyRetrieval=True;SslMode=None;
        run: |
          set -euo pipefail
          dotnet test -c Release tests/Pineda.Facturacion.IntegrationTests/Pineda.Facturacion.IntegrationTests.csproj \
            --filter "Category=MySqlIntegration" --no-build

      - name: Frontend install, build and tests
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run test

      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent-legacy-payment-prefill.yml
          rm .github/agent/legacy-payment-prefill.py
          rm .github/agent/fix-legacy-payment-script.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: prefill fiscal payment from legacy orders"
          git push origin HEAD:agent/legacy-payment-prefill
