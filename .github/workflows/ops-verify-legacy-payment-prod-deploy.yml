name: OPS Verify Legacy Payment PROD Deploy

on:
  push:
    branches:
      - ops/legacy-payment-prod-migration
    paths:
      - .github/workflows/ops-verify-legacy-payment-prod-deploy.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: facturas-production
    env:
      TARGET_SHA: 9df4c51f668a2a57a305efd73cf22755dd1b3a84
      SSH_HOST: ${{ secrets.FACTURAS_SSH_HOST }}
      SSH_PORT: ${{ secrets.FACTURAS_SSH_PORT }}
      SSH_USER: ${{ secrets.FACTURAS_SSH_USER }}
      SSH_KEY: ${{ secrets.FACTURAS_SSH_KEY }}
      BACKEND_PATH: /var/www/facturas-backend/publish
      FRONTEND_PATH: /var/www/facturas-frontend

    steps:
      - name: Checkout operations branch
        uses: actions/checkout@v4
        with:
          ref: ops/legacy-payment-prod-migration
          path: ops-control
          fetch-depth: 1

      - name: Checkout released source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          path: release-src
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: release-src/frontend/package-lock.json

      - name: Build release backend
        shell: bash
        working-directory: release-src
        run: |
          set -euo pipefail
          dotnet restore Pineda.Facturacion.slnx
          dotnet publish src/Pineda.Facturacion.Api/Pineda.Facturacion.Api.csproj -c Release -o out/api
          test -f out/api/Pineda.Facturacion.Api.dll
          sha256sum out/api/Pineda.Facturacion.Api.dll | awk '{print $1}' > /tmp/local-backend.sha

      - name: Build release frontend
        shell: bash
        working-directory: release-src/frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build -- --configuration production
          if [ -f "dist/frontend/browser/index.html" ]; then
            DIST_DIR="dist/frontend/browser"
          elif [ -f "dist/frontend/index.html" ]; then
            DIST_DIR="dist/frontend"
          else
            echo "ERROR: frontend release artifact not found"
            exit 1
          fi
          (cd "$DIST_DIR" && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}') > /tmp/local-frontend.sha

      - name: Setup SSH
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SSH_HOST:-}" ]
          [ -n "${SSH_PORT:-}" ]
          [ -n "${SSH_USER:-}" ]
          [ -n "${SSH_KEY:-}" ]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Wait for and verify exact production artifacts
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_BACKEND="$(cat /tmp/local-backend.sha)"
          LOCAL_FRONTEND="$(cat /tmp/local-frontend.sha)"

          for attempt in $(seq 1 30); do
            REMOTE_BACKEND="$(ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
              "sha256sum '$BACKEND_PATH/Pineda.Facturacion.Api.dll' 2>/dev/null | awk '{print \\$1}'" || true)"
            REMOTE_FRONTEND="$(ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
              "cd '$FRONTEND_PATH' 2>/dev/null && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print \\$1}'" || true)"
            SERVICE_ACTIVE="$(ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
              "systemctl is-active facturas-api 2>/dev/null || true" || true)"

            echo "Attempt $attempt/30: backend_match=$([ "$REMOTE_BACKEND" = "$LOCAL_BACKEND" ] && echo yes || echo no); frontend_match=$([ "$REMOTE_FRONTEND" = "$LOCAL_FRONTEND" ] && echo yes || echo no); service=$SERVICE_ACTIVE"

            if [ "$REMOTE_BACKEND" = "$LOCAL_BACKEND" ] \
              && [ "$REMOTE_FRONTEND" = "$LOCAL_FRONTEND" ] \
              && [ "$SERVICE_ACTIVE" = "active" ]; then
              echo "Production deployment matches released commit $TARGET_SHA."
              exit 0
            fi

            sleep 20
          done

          echo "ERROR: production did not converge to released artifacts within the verification window."
          exit 1

      - name: Record deployment verification marker
        shell: bash
        working-directory: ops-control
        run: |
          set -euo pipefail
          mkdir -p .ops
          cat > .ops/legacy-payment-prod-deploy-success.txt <<EOF
          release_sha=${TARGET_SHA}
          backend_verified=true
          frontend_verified=true
          service_active=true
          verified_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ops/legacy-payment-prod-deploy-success.txt
          git commit -m "ops: confirmar despliegue Legacy en producción"
          git push origin HEAD:ops/legacy-payment-prod-migration
