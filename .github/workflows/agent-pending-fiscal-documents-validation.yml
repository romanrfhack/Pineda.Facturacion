name: Agent Pending Fiscal Documents Validation

on:
  push:
    branches:
      - agent/pending-fiscal-documents-inbox

concurrency:
  group: agent-pending-fiscal-documents-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose-backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: facturas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=localhost;Database=facturas_test;User=root;Password=;
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run backend diagnostics
        id: diagnose
        shell: bash
        run: |
          set +e

          dotnet restore Pineda.Facturacion.slnx > backend-restore.log 2>&1
          restore_code=$?

          dotnet build -c Release Pineda.Facturacion.slnx --no-restore > backend-build.log 2>&1
          build_code=$?

          dotnet test -c Release Pineda.Facturacion.slnx --no-build > backend-test.log 2>&1
          test_code=$?

          export PINEDA_FACTURACION_RUN_MYSQL_TESTS=true
          export PINEDA_FACTURACION_MYSQL_TEST_CONNECTION="Server=127.0.0.1;Port=3306;User ID=root;Password=;AllowPublicKeyRetrieval=True;SslMode=None;"
          dotnet test -c Release tests/Pineda.Facturacion.IntegrationTests/Pineda.Facturacion.IntegrationTests.csproj --filter "Category=MySqlIntegration" --no-build > mysql-test.log 2>&1
          mysql_code=$?

          printf 'restore=%s\nbuild=%s\ntest=%s\nmysql=%s\n' \
            "$restore_code" "$build_code" "$test_code" "$mysql_code" > backend-status.env

          echo "restore_code=$restore_code" >> "$GITHUB_OUTPUT"
          echo "build_code=$build_code" >> "$GITHUB_OUTPUT"
          echo "test_code=$test_code" >> "$GITHUB_OUTPUT"
          echo "mysql_code=$mysql_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist backend diagnostics
        if: always()
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.sha }}
          RESTORE_CODE: ${{ steps.diagnose.outputs.restore_code }}
          BUILD_CODE: ${{ steps.diagnose.outputs.build_code }}
          TEST_CODE: ${{ steps.diagnose.outputs.test_code }}
          MYSQL_CODE: ${{ steps.diagnose.outputs.mysql_code }}
        run: |
          set -euo pipefail
          mkdir -p .agent-ci
          tail -n 500 backend-restore.log > .agent-ci/backend-restore-tail.txt
          tail -n 500 backend-build.log > .agent-ci/backend-build-tail.txt
          tail -n 500 backend-test.log > .agent-ci/backend-test-tail.txt
          tail -n 500 mysql-test.log > .agent-ci/mysql-test-tail.txt

          cat > .agent-ci/backend-diagnostic-result.md <<EOF
          # Pending fiscal documents backend diagnostics

          - Commit validated: $VALIDATED_SHA
          - Restore exit code: $RESTORE_CODE
          - Build exit code: $BUILD_CODE
          - Test exit code: $TEST_CODE
          - MySQL exit code: $MYSQL_CODE
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent-ci/backend-diagnostic-result.md \
            .agent-ci/backend-restore-tail.txt \
            .agent-ci/backend-build-tail.txt \
            .agent-ci/backend-test-tail.txt \
            .agent-ci/mysql-test-tail.txt
          git commit -m "ci: record pending fiscal backend diagnostics [skip ci]"
          git push

      - name: Fail when backend diagnostics fail
        if: steps.diagnose.outputs.restore_code != '0' || steps.diagnose.outputs.build_code != '0' || steps.diagnose.outputs.test_code != '0' || steps.diagnose.outputs.mysql_code != '0'
        run: exit 1
