name: Agent Pending Fiscal Documents Validation

on:
  push:
    branches:
      - agent/pending-fiscal-documents-inbox

concurrency:
  group: agent-pending-fiscal-documents-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: facturas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=localhost;Database=facturas_test;User=root;Password=;
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate solution
        id: validate
        shell: bash
        run: |
          set +e
          : > final-validation.log
          overall=0

          run_logged() {
            label="$1"
            shift
            printf '\n===== %s =====\n' "$label" | tee -a final-validation.log
            "$@" 2>&1 | tee -a final-validation.log
            code=${PIPESTATUS[0]}
            printf '%s=%s\n' "$label" "$code" >> final-status.env
            if [ "$code" -ne 0 ]; then
              overall=1
            fi
          }

          run_logged "dotnet_restore" dotnet restore Pineda.Facturacion.slnx
          run_logged "dotnet_build" dotnet build -c Release Pineda.Facturacion.slnx --no-restore
          run_logged "dotnet_test" dotnet test -c Release Pineda.Facturacion.slnx --no-build
          run_logged "mysql_tests" bash -lc 'export PINEDA_FACTURACION_RUN_MYSQL_TESTS=true; export PINEDA_FACTURACION_MYSQL_TEST_CONNECTION="Server=127.0.0.1;Port=3306;User ID=root;Password=;AllowPublicKeyRetrieval=True;SslMode=None;"; dotnet test -c Release tests/Pineda.Facturacion.IntegrationTests/Pineda.Facturacion.IntegrationTests.csproj --filter "Category=MySqlIntegration" --no-build'
          run_logged "npm_ci" bash -lc 'cd frontend && npm ci'
          run_logged "frontend_build" bash -lc 'cd frontend && npm run build'
          run_logged "frontend_unit_tests" bash -lc 'cd frontend && npm run test'
          run_logged "playwright_install" bash -lc 'cd frontend && npx playwright install --with-deps chromium'
          run_logged "frontend_e2e" bash -lc 'cd frontend && npm run e2e:ci'

          echo "overall_status=$overall" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist final validation evidence
        if: always()
        shell: bash
        env:
          OVERALL_STATUS: ${{ steps.validate.outputs.overall_status }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .agent-ci
          tail -n 500 final-validation.log > .agent-ci/final-validation-log-tail.txt

          if [ "$OVERALL_STATUS" = "0" ]; then
            result="success"
          else
            result="failure"
          fi

          cat > .agent-ci/final-validation-result.md <<EOF
          # Pending fiscal documents final validation

          - Commit validated: $VALIDATED_SHA
          - Result: $result

          ## Exit codes
          EOF
          cat final-status.env >> .agent-ci/final-validation-result.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent-ci/final-validation-result.md .agent-ci/final-validation-log-tail.txt
          git commit -m "ci: record final pending fiscal validation [skip ci]"
          git push

      - name: Fail when validation failed
        if: steps.validate.outputs.overall_status != '0'
        run: exit 1
