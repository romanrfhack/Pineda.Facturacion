name: Agent Pending Fiscal Documents Validation

on:
  push:
    branches:
      - agent/pending-fiscal-documents-inbox

concurrency:
  group: agent-pending-fiscal-documents-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: facturas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=localhost;Database=facturas_test;User=root;Password=;
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate solution
        id: validate
        shell: bash
        run: |
          set +e
          : > agent-validation.log
          overall=0

          run_logged() {
            printf '\n===== %s =====\n' "$1" | tee -a agent-validation.log
            shift
            "$@" 2>&1 | tee -a agent-validation.log
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then
              overall=1
            fi
          }

          run_logged "dotnet restore" dotnet restore Pineda.Facturacion.slnx
          run_logged "dotnet build" dotnet build -c Release Pineda.Facturacion.slnx --no-restore
          run_logged "dotnet test" dotnet test -c Release Pineda.Facturacion.slnx --no-build
          run_logged "mysql integration subset" bash -lc 'export PINEDA_FACTURACION_RUN_MYSQL_TESTS=true; export PINEDA_FACTURACION_MYSQL_TEST_CONNECTION="Server=127.0.0.1;Port=3306;User ID=root;Password=;AllowPublicKeyRetrieval=True;SslMode=None;"; dotnet test -c Release tests/Pineda.Facturacion.IntegrationTests/Pineda.Facturacion.IntegrationTests.csproj --filter "Category=MySqlIntegration" --no-build'
          run_logged "npm ci" bash -lc 'cd frontend && npm ci'
          run_logged "frontend build" bash -lc 'cd frontend && npm run build'
          run_logged "frontend unit tests" bash -lc 'cd frontend && npm run test'
          run_logged "playwright install" bash -lc 'cd frontend && npx playwright install --with-deps chromium'
          run_logged "frontend e2e" bash -lc 'cd frontend && npm run e2e:ci'

          echo "overall_status=$overall" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report validation result
        if: always()
        uses: actions/github-script@v7
        env:
          OVERALL_STATUS: ${{ steps.validate.outputs.overall_status }}
        with:
          script: |
            const fs = require('fs');
            const success = process.env.OVERALL_STATUS === '0';
            let details = '';
            if (!success && fs.existsSync('agent-validation.log')) {
              const log = fs.readFileSync('agent-validation.log', 'utf8');
              details = `\n\nÚltima salida:\n\`\`\`text\n${log.slice(-12000)}\n\`\`\``;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 10,
              body: `<!-- pending-fiscal-documents-validation:${context.sha} -->\nValidación completa de la bandeja de documentos pendientes para \`${context.sha}\`: **${success ? 'success' : 'failure'}**.\n\nSe ejecutaron backend build/tests, integración MySQL, frontend build/unit tests y Playwright E2E.${details}`
            });

      - name: Persist validation evidence
        if: always()
        shell: bash
        env:
          OVERALL_STATUS: ${{ steps.validate.outputs.overall_status }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .agent-ci
          tail -n 400 agent-validation.log > .agent-ci/pending-fiscal-documents-log-tail.txt

          if [ "$OVERALL_STATUS" = "0" ]; then
            result="success"
          else
            result="failure"
          fi

          cat > .agent-ci/pending-fiscal-documents-result.md <<EOF
          # Pending fiscal documents validation

          - Commit validated: $VALIDATED_SHA
          - Result: $result
          - Backend: restore, build, unit/integration tests and MySQL subset executed
          - Frontend: install, build, unit tests and Playwright E2E executed
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent-ci/pending-fiscal-documents-result.md .agent-ci/pending-fiscal-documents-log-tail.txt
          git commit -m "ci: record pending fiscal documents validation [skip ci]"
          git push

      - name: Fail when validation failed
        if: steps.validate.outputs.overall_status != '0'
        run: exit 1
