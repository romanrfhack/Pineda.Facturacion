name: Agent Order Debt Validation

on:
  push:
    branches:
      - agent/order-debt-payment-eligibility

concurrency:
  group: agent-order-debt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: Strong_Passw0rd_2026!
          MYSQL_DATABASE: facturas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__DefaultConnection: Server=localhost;Database=facturas_test;User=root;Password=Strong_Passw0rd_2026!;
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Pineda.Facturacion.slnx
      - name: Build
        run: dotnet build -c Release Pineda.Facturacion.slnx --no-restore
      - name: Unit and integration tests
        env:
          DOTNET_ENVIRONMENT: Development
          ASPNETCORE_ENVIRONMENT: Development
        run: dotnet test -c Release Pineda.Facturacion.slnx --no-build
      - name: MySQL-backed integration subset
        env:
          DOTNET_ENVIRONMENT: Development
          ASPNETCORE_ENVIRONMENT: Development
          PINEDA_FACTURACION_RUN_MYSQL_TESTS: "true"
          PINEDA_FACTURACION_MYSQL_TEST_CONNECTION: Server=127.0.0.1;Port=3306;User ID=root;Password=Strong_Passw0rd_2026!;AllowPublicKeyRetrieval=True;SslMode=None;
        run: dotnet test -c Release tests/Pineda.Facturacion.IntegrationTests/Pineda.Facturacion.IntegrationTests.csproj --filter "Category=MySqlIntegration" --no-build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Unit tests
        working-directory: frontend
        run: npm run test
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        working-directory: frontend
        run: npm run e2e:ci
