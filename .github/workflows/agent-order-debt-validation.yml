name: Agent Order Debt Validation

on:
  push:
    branches:
      - agent/order-debt-payment-eligibility

concurrency:
  group: agent-order-debt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: Strong_Passw0rd_2026!
          MYSQL_DATABASE: facturas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__DefaultConnection: Server=localhost;Database=facturas_test;User=root;Password=Strong_Passw0rd_2026!;
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Validate backend
        shell: bash
        env:
          DOTNET_ENVIRONMENT: Development
          ASPNETCORE_ENVIRONMENT: Development
          PINEDA_FACTURACION_RUN_MYSQL_TESTS: "true"
          PINEDA_FACTURACION_MYSQL_TEST_CONNECTION: Server=127.0.0.1;Port=3306;User ID=root;Password=Strong_Passw0rd_2026!;AllowPublicKeyRetrieval=True;SslMode=None;
        run: |
          set -o pipefail
          {
            dotnet restore Pineda.Facturacion.slnx
            dotnet build -c Release Pineda.Facturacion.slnx --no-restore
            dotnet test -c Release Pineda.Facturacion.slnx --no-build
            dotnet test -c Release tests/Pineda.Facturacion.IntegrationTests/Pineda.Facturacion.IntegrationTests.csproj --filter "Category=MySqlIntegration" --no-build
          } 2>&1 | tee agent-backend.log
      - name: Report backend result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const status = process.env.JOB_STATUS;
            let details = '';
            if (status !== 'success' && fs.existsSync('agent-backend.log')) {
              const log = fs.readFileSync('agent-backend.log', 'utf8');
              details = `\n\nÚltima salida:\n\`\`\`text\n${log.slice(-9000)}\n\`\`\``;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 9,
              body: `<!-- agent-order-debt-backend:${context.sha} -->\nValidación temporal de **backend** para \`${context.sha}\`: **${status}**.${details}`
            });

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate frontend
        shell: bash
        run: |
          set -o pipefail
          {
            cd frontend
            npm ci
            npm run build
            npm run test
            npx playwright install --with-deps chromium
            npm run e2e:ci
          } 2>&1 | tee agent-frontend.log
      - name: Report frontend result
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const status = process.env.JOB_STATUS;
            let details = '';
            if (status !== 'success' && fs.existsSync('agent-frontend.log')) {
              const log = fs.readFileSync('agent-frontend.log', 'utf8');
              details = `\n\nÚltima salida:\n\`\`\`text\n${log.slice(-9000)}\n\`\`\``;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 9,
              body: `<!-- agent-order-debt-frontend:${context.sha} -->\nValidación temporal de **frontend** para \`${context.sha}\`: **${status}**.${details}`
            });
