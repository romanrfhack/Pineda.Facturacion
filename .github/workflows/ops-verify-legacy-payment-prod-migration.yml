name: OPS Verify Legacy Payment Migration PROD

on:
  push:
    branches:
      - ops/legacy-payment-prod-migration
    paths:
      - .github/workflows/ops-verify-legacy-payment-prod-migration.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: facturas-production
    env:
      SSH_HOST: ${{ secrets.FACTURAS_SSH_HOST }}
      SSH_PORT: ${{ secrets.FACTURAS_SSH_PORT }}
      SSH_USER: ${{ secrets.FACTURAS_SSH_USER }}
      SSH_KEY: ${{ secrets.FACTURAS_SSH_KEY }}

    steps:
      - name: Checkout operational branch
        uses: actions/checkout@v4
        with:
          ref: ops/legacy-payment-prod-migration
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build isolated schema verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/legacy-payment-schema-verifier
          cd /tmp/legacy-payment-schema-verifier

          cat > Verifier.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="MySqlConnector" Version="2.3.7" />
            </ItemGroup>
          </Project>
          EOF

          cat > Program.cs <<'EOF'
          using System.Text.Json;
          using MySqlConnector;

          const string migrationId = "20260813054914_AddLegacyPaymentSuggestionSnapshot";

          if (args.Length != 1 || !File.Exists(args[0]))
          {
              Console.Error.WriteLine("Production configuration file was not found.");
              return 2;
          }

          using var document = JsonDocument.Parse(await File.ReadAllTextAsync(args[0]));
          var root = document.RootElement;
          string? connectionString = null;

          if (root.TryGetProperty("ConnectionStrings", out var connectionStrings)
              && connectionStrings.ValueKind == JsonValueKind.Object
              && connectionStrings.TryGetProperty("BillingWrite", out var standardBillingWrite)
              && standardBillingWrite.ValueKind == JsonValueKind.String)
          {
              connectionString = standardBillingWrite.GetString();
          }

          if (string.IsNullOrWhiteSpace(connectionString)
              && root.TryGetProperty("BillingWrite", out var billingWrite)
              && billingWrite.ValueKind == JsonValueKind.Object
              && billingWrite.TryGetProperty("ConnectionString", out var legacyBillingWrite)
              && legacyBillingWrite.ValueKind == JsonValueKind.String)
          {
              connectionString = legacyBillingWrite.GetString();
          }

          if (string.IsNullOrWhiteSpace(connectionString))
          {
              Console.Error.WriteLine("BillingWrite connection string is not configured.");
              return 3;
          }

          await using var connection = new MySqlConnection(connectionString);
          await connection.OpenAsync();

          static async Task<bool> TableExistsAsync(MySqlConnection connection, string tableName)
          {
              const string sql = "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = @tableName;";
              await using var command = new MySqlCommand(sql, connection);
              command.Parameters.AddWithValue("@tableName", tableName);
              return Convert.ToInt32(await command.ExecuteScalarAsync()) == 1;
          }

          static async Task<bool> ColumnMatchesAsync(MySqlConnection connection, string name, long expectedLength)
          {
              const string sql = """
                  SELECT DATA_TYPE, CHARACTER_MAXIMUM_LENGTH, IS_NULLABLE
                  FROM INFORMATION_SCHEMA.COLUMNS
                  WHERE TABLE_SCHEMA = DATABASE()
                    AND TABLE_NAME = 'sales_order'
                    AND COLUMN_NAME = @name
                  LIMIT 1;
                  """;
              await using var command = new MySqlCommand(sql, connection);
              command.Parameters.AddWithValue("@name", name);
              await using var reader = await command.ExecuteReaderAsync();
              if (!await reader.ReadAsync()) return false;
              return string.Equals(reader.GetString(0), "varchar", StringComparison.OrdinalIgnoreCase)
                  && !reader.IsDBNull(1)
                  && reader.GetInt64(1) == expectedLength
                  && string.Equals(reader.GetString(2), "YES", StringComparison.OrdinalIgnoreCase);
          }

          if (!await TableExistsAsync(connection, "sales_order")
              || !await TableExistsAsync(connection, "__EFMigrationsHistory"))
          {
              Console.Error.WriteLine("Required production tables are missing.");
              return 4;
          }

          var codeOk = await ColumnMatchesAsync(connection, "legacy_payment_code", 15);
          var descriptionOk = await ColumnMatchesAsync(connection, "legacy_payment_description", 60);

          const string historySql = "SELECT COUNT(*) FROM `__EFMigrationsHistory` WHERE `MigrationId` = @migrationId AND `ProductVersion` = '8.0.13';";
          await using var historyCommand = new MySqlCommand(historySql, connection);
          historyCommand.Parameters.AddWithValue("@migrationId", migrationId);
          var historyOk = Convert.ToInt32(await historyCommand.ExecuteScalarAsync()) == 1;

          Console.WriteLine($"Production schema verification: code={codeOk}; description={descriptionOk}; history={historyOk}");
          if (!codeOk || !descriptionOk || !historyOk)
          {
              Console.Error.WriteLine("Production Legacy payment migration is not fully applied. Promotion must remain blocked.");
              return 5;
          }

          Console.WriteLine("Production Legacy payment migration verified successfully.");
          return 0;
          EOF

          dotnet publish Verifier.csproj -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:DebugType=None -o publish
          test -x publish/Verifier

      - name: Setup SSH
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${SSH_HOST:-}" ]
          [ -n "${SSH_PORT:-}" ]
          [ -n "${SSH_USER:-}" ]
          [ -n "${SSH_KEY:-}" ]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Verify production schema
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -P "$SSH_PORT" \
            /tmp/legacy-payment-schema-verifier/publish/Verifier \
            "$SSH_USER@$SSH_HOST:/tmp/pineda-legacy-payment-verifier"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "chmod 700 /tmp/pineda-legacy-payment-verifier && sudo /tmp/pineda-legacy-payment-verifier /etc/pineda/facturas/appsettings.Production.json"

      - name: Cleanup verifier
        if: always()
        shell: bash
        run: |
          set +e
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "rm -f /tmp/pineda-legacy-payment-verifier" || true

      - name: Record verified migration marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ops
          cat > .ops/legacy-payment-prod-migration-success.txt <<EOF
          migration=20260813054914_AddLegacyPaymentSuggestionSnapshot
          verified=true
          commit=${GITHUB_SHA}
          verified_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ops/legacy-payment-prod-migration-success.txt
          git commit -m "ops: confirmar migración Legacy en producción"
          git push origin HEAD:ops/legacy-payment-prod-migration
